<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Início — Pato Devs</title>
  <meta name="description" content="Uma comunidade de desenvolvedores para compartilhar conhecimento, conectar ideias e construir projetos juntos.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://patodevs.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://patodevs.vercel.app/">
  <meta property="og:title" content="Início — Pato Devs">
  <meta property="og:description" content="Uma comunidade de desenvolvedores para compartilhar conhecimento, conectar ideias e construir projetos juntos.">
  <meta property="og:image" content="https://patodevs.vercel.app/assets/img/pato-branco.png">
  <meta property="og:image:alt" content="Logo Pato Devs">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://patodevs.vercel.app/">
  <meta name="twitter:title" content="Início — Pato Devs">
  <meta name="twitter:description" content="Uma comunidade de desenvolvedores para compartilhar conhecimento, conectar ideias e construir projetos juntos.">
  <meta name="twitter:image" content="https://patodevs.vercel.app/assets/img/pato-branco.png">
  <link rel="icon" href="assets/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .top { position: relative; }
    .top .menu-toggle { display: none; }

    @media (max-width: 560px) {
      .top .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 44px;
        width: 44px;
        height: 44px;
        margin-left: auto;
        padding: 0;
        border: 2px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        color: var(--ink);
        font: 24px/1 system-ui, sans-serif;
        cursor: pointer;
      }

      .top nav.site-menu {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        left: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        gap: 4px;
        padding: 8px;
        border: 2px solid var(--line);
        border-radius: 16px;
        background: var(--bg);
        box-shadow: 0 12px 24px rgb(0 0 0 / 12%);
      }

      .top nav.site-menu:not(.is-open) {
        display: none;
      }

      .top nav.site-menu a {
        display: flex;
        justify-content: flex-start;
        flex: none;
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border-radius: 10px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="first">
      <header class="top">
        <a href="index.html" aria-label="Pato Devs, página inicial">
          <img class="l" src="assets/img/logo-horizontal-preto.png" alt="Pato Devs">
          <img class="d" src="assets/img/logo-horizontal-branco.png" alt="Pato Devs">
        </a>

        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="site-menu">
          <span aria-hidden="true">☰</span>
        </button>

        <nav id="site-menu" class="site-menu" aria-label="Principal">
          <a href="index.html" aria-current="page">Início</a>
          <a href="pages/conteudos.html">Conteúdos</a>
          <a href="pages/sobre.html">Sobre</a>
        </nav>
      </header>

      <section class="hero">
        <div>
          <h1>Venha nadar com a gente.</h1>
          <p class="lead">Uma comunidade de desenvolvedores para compartilhar conhecimento, conectar ideias e construir projetos juntos.</p>
          <a class="cta" href="https://discord.gg/9tGbJGCNey">Entrar na comunidade</a>
          <p class="term" aria-hidden="true">&gt; npm install patodevs<i></i></p>
        </div>

        <div class="duck">
          <b class="ring"></b>
          <b class="ring"></b>
          <b class="ring"></b>
          <img class="l" src="assets/img/pato-preto.png" alt="">
          <img class="d" src="assets/img/pato-branco.png" alt="">
        </div>
      </section>
    </div>
  </div>

  <a class="gh" href="https://github.com/PatoDevs" target="_blank" rel="noopener" aria-label="Pato Devs no GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span>Nosso GitHub</span>
  </a>

  <script>
    (() => {
      const button = document.querySelector(".menu-toggle");
      const menu = document.querySelector("#site-menu");

      function setOpen(open) {
        menu.classList.toggle("is-open", open);
        button.setAttribute("aria-expanded", String(open));
        button.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu");
        button.querySelector("span").textContent = open ? "×" : "☰";
      }

      button.addEventListener("click", () => {
        setOpen(button.getAttribute("aria-expanded") !== "true");
      });

      document.addEventListener("click", (event) => {
        if (!menu.contains(event.target) && !button.contains(event.target)) {
          setOpen(false);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && button.getAttribute("aria-expanded") === "true") {
          setOpen(false);
          button.focus();
        }
      });

      menu.addEventListener("click", (event) => {
        if (event.target.closest("a")) setOpen(false);
      });

      window.matchMedia("(max-width: 560px)")
        .addEventListener("change", () => setOpen(false));
    })();
  </script>
</body>
</html>
